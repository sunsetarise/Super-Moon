name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile source
        run: make compile
      - name: Run version-isolated tests
        run: make test
      - name: Validate the LFS pointer or fetched asset
        run: python tools/verify_assets.py --allow-lfs-pointer

