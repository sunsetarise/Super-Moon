[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supermoon34-new-universe"
version = "34.0.0"
description = "SUPER MOON 34 New Universe additive HPC and civil-aerospace qualification layer"
readme = "README_SM34_NEW_UNIVERSE.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
petsc-mpi = ["petsc4py>=3.20", "mpi4py>=4"]
cad = ["cadquery>=2.5"]
gpu-cuda = ["cupy-cuda12x>=13"]
test = ["pytest>=8"]

[project.scripts]
supermoon34 = "supermoon34.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["supermoon31*", "supermoon32*", "supermoon33*", "supermoon34*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

